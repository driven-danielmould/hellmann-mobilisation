<style>
:root{--fg:#1b1f2a;--fg-muted:#5c6370;--bg:#f6f7f9;--panel:#ffffff;--line:#dfe3ea;--navy:#1f2a5c;--orange:#e8762b;--bad:#c0392b}
@media (prefers-color-scheme: dark){:root{--fg:#e8eaf0;--fg-muted:#a3a9b5;--bg:#12151c;--panel:#1b1f29;--line:#2c3240}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.45;min-height:100%}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px}
.brand{display:flex;align-items:baseline;gap:4px;font-weight:700;font-size:20px;letter-spacing:-.01em;margin-bottom:18px}.brand span{color:var(--orange)}
.box h1{font-size:17px;font-weight:600;margin:0 0 4px}.box p{margin:0 0 18px;color:var(--fg-muted);font-size:14px}
label{display:block;font-size:13px;color:var(--fg-muted);margin:12px 0 4px}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
input:focus{outline:2px solid var(--navy);outline-offset:1px}
button{margin-top:18px;width:100%;font:inherit;font-weight:600;padding:11px;border:0;border-radius:8px;background:var(--navy);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:1.2em}
</style>
</head>

const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(user, pw){
  const u = VAULT.users[user]; if(!u) throw new Error('no user');
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const dk = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(u.salt), iterations:VAULT.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const K = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(u.iv)}, dk, b64(u.key));
  const ck = await crypto.subtle.importKey('raw', K, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(VAULT.iv)}, ck, b64(VAULT.ct));
  return new TextDecoder().decode(pt);
}
function mount(html, user){
  document.getElementById('gate').remove();
  const host = document.createElement('div'); host.innerHTML = html; document.body.appendChild(host);
  const who = document.getElementById('who'); if(who){ who.textContent = 'Signed in as ' + user; const b = document.createElement('button'); b.textContent = 'Sign out'; b.onclick = () => location.reload(); who.appendChild(b); }
  host.querySelectorAll('script').forEach(s => { const n = document.createElement('script'); n.textContent = s.textContent; s.replaceWith(n); });
}
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault(); const err = document.getElementById('err'), go = document.getElementById('go'); err.textContent = ''; go.disabled = true;
  const user = document.getElementById('u').value.trim().toLowerCase(), pw = document.getElementById('p').value;
  try { const html = await unlock(user, pw); mount(html, user); }
  catch (ex) { err.textContent = 'That username and password don’t match.'; go.disabled = false; }
});
</script>
